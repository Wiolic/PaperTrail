# 科研同义词库 (Scientific Synonym Dictionary)
#
# 用途:
#   1. 搜索时自动展开: 搜 "Ir degradation" → 同时搜 "Ir dissolution", "Ir leaching" 等
#   2. 入库时规范 keywords: DeepSeek prompt 引用此表, 同义词统一用 canonical 写法
#   3. 主题综述/检索时聚合: 确保同一机制的 20 种写法不被遗漏
#
# 格式:
#   canonical: 规范写法(入库 keywords 应统一使用此写法)
#   synonyms: 同义词/变体写法(搜索时展开, 入库时归一化到 canonical)
#   related: 相关概念(不是同义词, 但常一起出现, 供交叉检索)
#   domain: 所属领域标签
#
# 维护规则:
#   - 新增词条前先查是否已有语义重叠的条目, 有则合并, 不要建近义重复条目
#   - synonyms 里不要放 canonical 已经在用的写法
#   - related 是"相关"不是"同义", 别把同义词错放进 related

